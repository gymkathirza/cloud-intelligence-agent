name: "Production: Cloud Agent CI/CD"

"on":
  # 1. Automatic: Runs CI tests on PR merge to main (to verify code before Streamlit syncs)
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  # 2. Manual: Specific trigger for AWS ECS Fargate deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to AWS ECS Fargate environment?'
        required: true
        type: boolean
        default: true
      connection_test:
        description: 'Run connection test before deployment?'
        required: false
        type: boolean
        default: false
      tools_verification_test:
        description: 'Run tools verification tests before deployment?'
        required: false
        type: boolean
        default: false
      agent_example_test:
        description: 'Run agent example before deployment?'
        required: false
        type: boolean
        default: false
      crew_test:
        description: 'Run crew before deployment?'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write # Required for OIDC
  contents: read  # Required for Checkout

jobs:
  # Job 1: Infrastructure & Test (Runs on every push/merge to main)
  terraform-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -backend-config="prod.config"

      # In enterprise, we use -var-file to target specific environments
      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -auto-approve \
            -var-file="envs/prod.tfvars" \
            -var="google_api_key=${{ secrets.GOOGLE_API_KEY }}"
        env:
          # Ensure GitHub can authenticate to AWS via OIDC
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}


      - name: Populate DynamoDB Sample Data
        working-directory: ./
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: aws dynamodb batch-write-item --request-items file://src/data/sample-data.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./
        run: |
          pip install -r ./src/requirements.txt

      - name: Run Connection Test
        if: |
          vars.RUN_CONNECTION_TEST == 'true' ||
          inputs.connection_test == true
        working-directory: ./
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python ./src/verify_connection.py

      - name: Run Tool Verification Tests
        if: |
          vars.RUN_TOOL_VERIFICATION_TEST == 'true' ||
          inputs.tools_verification_test == true
        working-directory: ./
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python ./src/verify_tools.py

      - name: Run Agent Example
        if: |
          vars.RUN_AGENT_EXAMPLE_TEST == 'true' ||
          inputs.agent_example_test == true
        working-directory: ./
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python ./src/agent_example.py

      - name: Run Crew
        if: |
          vars.RUN_CREW_TEST == 'true' ||
          inputs.crew_test == true
        working-directory: ./
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python ./src/main.py

  # Job 2: Deploy to AWS ECS Fargate (Only runs when manually triggered via workflow_dispatch)
  deploy-to-ecs:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == true
    needs: terraform-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR [5]
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image [5, 12]
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: agentic-ai-app
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster agentic-ai-cluster --service agentic-ai